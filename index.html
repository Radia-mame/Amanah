<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Amanah">
  <title>Amanah</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f5f3;
      --bg-2:#f2efe9;
      --surface:#ffffff;
      --surface-2:#f8f7f5;
      --surface-3:#f2efe9;
      --ink:#1d1d1b;
      --muted:#66645e;
      --line:#e9e4df;
      --field:#e4ddd5;
      --accent:#1f8b6f;
      --accent-2:#eaf8f4;
      --accent-ink:#ffffff;
      --green-strong:#1a7a5c;
      --good:#1a7a5c;
      --good-soft:#eaf7f0;
      --warn:#b76b00;
      --warn-soft:#fff1d8;
      --bad:#c24438;
      --bad-soft:#fde8e5;
      --shadow:0 12px 28px rgba(29,29,27,0.06);
      --shadow-soft:0 6px 18px rgba(29,29,27,0.04);
      --radius-xl:26px;
      --radius-lg:18px;
      --radius-md:14px;
      --radius-sm:12px;
      --font:'Inter','Segoe UI',sans-serif;
    }

    html{
      color-scheme:light;
      scroll-behavior:smooth;
    }

    html[data-mode="dark"]{
      color-scheme:dark;
      --bg:#0f1114;
      --bg-2:#181b1e;
      --surface:#1a1d20;
      --surface-2:#20252a;
      --surface-3:#272d31;
      --ink:#f2f2f0;
      --muted:#a8b0b9;
      --line:#2b3237;
      --field:#2f383f;
      --accent:#52c6a0;
      --accent-2:#1b3730;
      --accent-ink:#091d18;
      --good:#7fe5ad;
      --good-soft:#1a382f;
      --warn:#ffc870;
      --warn-soft:#403318;
      --bad:#ff8c82;
      --bad-soft:#402827;
      --shadow:0 12px 28px rgba(0,0,0,0.2);
      --shadow-soft:0 5px 15px rgba(0,0,0,0.12);
    }

    html[data-size="large"] body{
      zoom: 1.08;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:
        radial-gradient(circle at top, rgba(31,139,111,0.06), transparent 26%),
        var(--bg);
      color:var(--ink);
      font-family:var(--font);
      font-size:13px;
      line-height:1.45;
      letter-spacing:-0.01em;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      padding-inline:14px;
      padding-top:calc(18px + env(safe-area-inset-top, 0px));
      padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
      transition:background .25s ease, color .25s ease;
    }

    body.nonav{
      padding-bottom:40px;
    }

    #app{
      max-width:430px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    h1,h2,h3,p{
      margin:0;
      letter-spacing:-0.02em;
    }

    button,input,select,textarea{
      font:inherit;
      color:inherit;
    }

    button{
      cursor:pointer;
      border:none;
      background:none;
    }

    :focus-visible{
      outline:3px solid rgba(31,139,111,0.35);
      outline-offset:2px;
    }

    small{
      font-size:12px;
      color:var(--muted);
    }

    .num{
      font-variant-numeric: tabular-nums;
      font-weight:700;
      letter-spacing:-0.02em;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:4px 2px 10px;
    }

    .top h1{
      font-size:24px;
      font-weight:800;
      letter-spacing:-0.04em;
      text-transform:none;
      color:var(--ink);
    }

    .top .acts{
      display:flex;
      align-items:center;
      gap:8px;
      flex:none;
    }

    .sub{
      font-size:12.5px;
      color:var(--muted);
      margin-top:2px;
    }

    .pagehead{
      display:flex;
      align-items:center;
      gap:12px;
      padding:2px 0;
    }

    .pagehead h1{
      font-size:22px;
      font-weight:800;
      flex:1;
      min-width:0;
      overflow-wrap:anywhere;
    }

    .iconbtn{
      flex:none;
      width:42px;
      height:42px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:var(--shadow-soft);
    }

    .iconbtn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:var(--accent-ink);
    }

    .badge{
      position:absolute;
      top:-6px;
      right:-6px;
      min-width:18px;
      height:18px;
      border-radius:50%;
      background:var(--bad);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:800;
    }

    [data-mode="dark"] .badge{
      color:#111315;
    }

    .card, .flush{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px 16px;
      box-shadow:var(--shadow-soft);
    }

    .card.flush{
      padding:8px 10px;
    }

    .card h3{
      font-size:14px;
      font-weight:700;
      margin-bottom:8px;
    }

    .cardhead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
    }

    .cardhead h3{
      margin:0;
    }

    .link{
      min-height:42px;
      padding:0 4px;
      border:none;
      background:transparent;
      color:var(--accent);
      font-weight:700;
      font-size:14px;
    }

    .btn{
      min-height:46px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--ink);
      font-weight:700;
      padding:0 16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow:none;
    }

    .btn.primary{
      background:var(--accent);
      border-color:var(--accent);
      color:var(--accent-ink);
      box-shadow:0 12px 24px rgba(31,139,111,0.16);
    }

    .btn.danger{
      color:var(--bad);
      border-color:var(--bad-soft);
      background:var(--bad-soft);
    }

    .btn.armed,
    .btn.dangerfill{
      background:var(--bad);
      color:#fff;
      border-color:var(--bad);
    }

    [data-mode="dark"] .btn.armed,
    [data-mode="dark"] .btn.dangerfill{
      color:#111315;
    }

    .btn.sm{
      min-height:42px;
      font-size:13px;
    }

    .btn[disabled]{
      opacity:.45;
      cursor:not-allowed;
    }

    .btn.wide{
      width:100%;
    }

    .btns{
      display:flex;
      gap:10px;
    }

    .btns > *{
      flex:1;
    }

    .chips{
      display:flex;
      align-items:center;
      gap:8px;
      overflow-x:auto;
      padding-bottom:2px;
      scrollbar-width:none;
      flex-wrap:wrap;
    }

    .chips::-webkit-scrollbar{
      display:none;
    }

    .chip{
      flex:none;
      min-height:40px;
      min-width:42px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--surface-2);
      color:var(--muted);
      font-weight:600;
      font-size:12px;
      transition:all .2s ease;
    }

    .chip[aria-pressed="true"]{
      background:var(--accent);
      border-color:var(--accent);
      color:var(--accent-ink);
      box-shadow:0 10px 20px rgba(62,92,242,0.12);
    }

    .seg{
      display:flex;
      gap:4px;
      padding:4px;
      border-radius:16px;
      background:var(--surface-2);
      border:1px solid var(--line);
    }

    .seg button{
      flex:1;
      min-height:42px;
      border-radius:10px;
      border:none;
      background:transparent;
      font-weight:700;
      font-size:13px;
      color:var(--muted);
    }

    .seg button[aria-pressed="true"]{
      background:var(--surface);
      color:var(--ink);
      box-shadow:0 2px 8px rgba(31,31,31,0.06);
    }

    .search{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:50px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--surface-2);
      padding:0 12px;
      color:var(--muted);
    }

    .search input{
      flex:1;
      min-width:0;
      border:none;
      background:transparent;
      outline:none;
      min-height:48px;
      color:var(--ink);
      font-size:14px;
    }

    .row{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      border:none;
      border-bottom:1px solid var(--line);
      background:transparent;
      text-align:left;
      min-height:62px;
      color:var(--ink);
      border-radius:0;
      padding:12px 8px;
    }

    .row:last-child{
      border-bottom:none;
    }

    .row .grow{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .row .grow b{
      font-weight:700;
      overflow-wrap:anywhere;
      font-size:15px;
    }

    .row .end{
      text-align:right;
      display:flex;
      flex-direction:column;
      gap:2px;
      align-items:flex-end;
    }

    .row .end b{
      font-weight:800;
      font-size:15px;
    }

    .row.off{
      opacity:.65;
    }

    .row.off .grow b{
      text-decoration:line-through;
    }

    .tag{
      display:inline-block;
      font-size:11px;
      font-weight:700;
      padding:5px 9px;
      border-radius:999px;
      white-space:nowrap;
    }

    .tag.bad{
      background:var(--bad-soft);
      color:var(--bad);
    }

    .tag.warn{
      background:var(--warn-soft);
      color:var(--warn);
    }

    .tag.good{
      background:var(--good-soft);
      color:var(--good);
    }

    .tag.info{
      background:var(--accent-2);
      color:var(--accent);
    }

    .tag.gray{
      background:var(--surface-2);
      color:var(--muted);
    }

    .tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    .banner{
      display:flex;
      align-items:center;
      gap:12px;
      background:var(--warn-soft);
      color:var(--warn);
      border:1px solid rgba(183,107,0,0.1);
      border-radius:14px;
      padding:12px 14px;
      font-size:13px;
    }

    .banner span{
      flex:1;
    }

    .banner button{
      flex:none;
      min-height:42px;
      padding:0 12px;
      border-radius:12px;
      border:1px solid currentColor;
      background:transparent;
      font-weight:700;
      color:inherit;
    }

    html[data-mode="dark"] .banner{
      background:var(--surface-2);
      color:var(--ink);
    }

    .empty{
      padding:22px 10px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:13px;
      font-weight:600;
      color:var(--muted);
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      min-height:46px;
      border-radius:12px;
      border:1px solid var(--field);
      background:var(--surface-2);
      padding:0 14px;
      font-size:14px;
      color:var(--ink);
      transition:border-color .2s ease, box-shadow .2s ease;
    }

    .field textarea{
      padding:12px 14px;
      min-height:96px;
      resize:vertical;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .grid2{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .sum{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sum .total{
      border-top:1px solid var(--line);
      padding-top:12px;
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:12px;
    }

    .sum .total b{
      font-size:24px;
      font-weight:800;
      color:var(--accent);
    }

    .sum .total b.out{
      color:var(--warn);
    }

    .err{
      background:var(--bad-soft);
      color:var(--bad);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      font-weight:600;
    }

    .scrim{
      position:fixed;
      inset:0;
      background:rgba(29,29,27,0.45);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      z-index:30;
    }

    .scrim.center{
      align-items:center;
      padding:16px;
      z-index:50;
    }

    .panel{
      width:100%;
      max-width:480px;
      max-height:92%;
      overflow-y:auto;
      background:var(--surface);
      color:var(--ink);
      border-radius:24px 24px 0 0;
      padding:16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      border:1px solid var(--line);
      box-shadow:0 18px 44px rgba(29,29,27,0.12);
    }

    .scrim.center .panel{
      border-radius:24px;
      max-height:86%;
    }

    .panel .head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .panel h2{
      font-size:17px;
      font-weight:800;
      overflow-wrap:anywhere;
    }

    .nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      background:rgba(255,255,255,0.84);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-top:1px solid var(--line);
      z-index:20;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      box-shadow:0 -10px 22px rgba(29,29,27,0.04);
    }

    html[data-mode="dark"] .nav{
      background:rgba(15,17,20,0.8);
    }

    .nav .in{
      max-width:430px;
      margin-inline:auto;
      display:flex;
      justify-content:space-around;
      align-items:flex-start;
    }

    .nav button{
      width:68px;
      min-height:58px;
      border:none;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-size:11.5px;
      font-weight:700;
      color:var(--muted);
      padding:0;
      line-height:1.1;
    }

    .nav button[aria-current="page"]{
      color:var(--accent);
      font-weight:800;
    }

    .nav .mid{
      margin-top:-26px;
    }

    .nav .mid .disc{
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--accent);
      color:var(--accent-ink);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 12px 24px rgba(31,139,111,0.18);
    }

    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:calc(92px + env(safe-area-inset-bottom, 0px));
      background:var(--ink);
      color:var(--surface);
      padding:10px 16px;
      border-radius:12px;
      font-size:12px;
      font-weight:600;
      box-shadow:0 16px 30px rgba(0,0,0,0.18);
    }

    .kv{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:6px 0;
      font-size:14px;
    }

    .kv span:first-child{
      color:var(--muted);
    }

    .swatches{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }

    .swatch{
      border:2px solid var(--line);
      border-radius:16px;
      background:var(--surface);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:flex-start;
      color:var(--ink);
      min-height:44px;
    }

    .swatch[aria-pressed="true"]{
      border-color:var(--accent);
    }

    .swatch .dots{
      display:flex;
      gap:4px;
    }

    .swatch .dots i{
      width:22px;
      height:22px;
      border-radius:50%;
      display:block;
      border:1px solid rgba(128,128,128,0.4);
    }

    .swatch span{
      font-size:13px;
      font-weight:700;
    }

    .qa{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .qa button{
      min-height:76px;
      border-radius:18px;
      border:1px solid var(--line);
      background:var(--surface);
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      gap:6px;
      padding:12px 14px;
    }

    .qa button .ci{
      color:var(--accent);
    }

    .pad{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      max-width:320px;
      width:100%;
      margin-inline:auto;
    }

    .pad button{
      min-height:64px;
      border-radius:18px;
      font-size:24px;
      font-weight:700;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--ink);
    }

    .dots{
      display:flex;
      gap:14px;
      justify-content:center;
    }

    .dots i{
      width:16px;
      height:16px;
      border-radius:50%;
      border:2px solid var(--accent);
      display:block;
    }

    .dots i.on{
      background:var(--accent);
    }

    .ring{
      position:relative;
      width:78px;
      height:78px;
      flex:none;
    }

    .ring svg{
      width:100%;
      height:100%;
    }

    .rt,.rf{
      fill:none;
      stroke-width:10;
    }

    .rt{
      stroke:var(--line);
    }

    .rf{
      stroke:var(--accent);
      stroke-linecap:round;
      transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);
    }

    .rc{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
    }

    .dot.g{
      background:var(--good);
    }

    .dot.o{
      background:var(--bad);
    }

    .tl{
      fill:none;
      stroke:var(--accent);
      stroke-width:2.5;
      stroke-linecap:round;
      stroke-linejoin:round;
      vector-effect:non-scaling-stroke;
    }

    .ta{
      fill:var(--accent);
      opacity:.12;
    }

    .cpick{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .cpick label{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-size:12px;
      color:var(--muted);
    }

    .cpick input{
      width:100%;
      height:46px;
      border:1.5px solid var(--line);
      border-radius:12px;
      background:var(--surface);
      padding:3px;
    }

    .daterow{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .daterow label{
      flex:1;
      min-width:140px;
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:13px;
      font-weight:600;
    }

    .daterow input{
      width:100%;
      box-sizing:border-box;
      min-height:44px;
      padding:0 12px;
      border:1px solid var(--field);
      border-radius:12px;
      background:var(--surface-2);
      color:var(--ink);
      font:inherit;
    }

    .daygroup{
      margin:16px 4px 6px;
      font-size:13px;
      font-weight:700;
      color:var(--ink);
    }

    .chips[role="group"]{
      flex-wrap:wrap;
      overflow:visible;
    }

    .lr .row{
      gap:14px;
    }

    .lr .row .grow{
      flex:1 1 0;
      min-width:0;
      padding-right:6px;
    }

    .lr .row .grow small{
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .lr .row .end{
      flex:none;
      min-width:104px;
      padding-right:2px;
    }

    .macro-hero{
      background:
        linear-gradient(180deg, rgba(31,139,111,0.08), rgba(255,255,255,0)),
        var(--surface);
      border:1px solid var(--line);
      border-radius:26px;
      padding:18px 16px;
      box-shadow:var(--shadow-soft);
    }

    .macro-hero-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .macro-hero-title{
      font-size:12px;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
    }

    .macro-hero-value{
      font-size:34px;
      font-weight:800;
      letter-spacing:-0.06em;
      line-height:1;
    }

    .macro-hero-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:10px;
    }

    .macro-mini{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
      margin-top:12px;
    }

    .macro-mini .mini-card{
      background:var(--surface-2);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 12px 10px;
    }

    .mini-label{
      font-size:11px;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
    }

    .mini-value{
      display:block;
      margin-top:6px;
      font-size:22px;
      font-weight:800;
      letter-spacing:-0.04em;
    }

    .macro-row{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:14px 10px;
      border-radius:16px;
      background:var(--surface-2);
      border:1px solid var(--line);
      transition:transform .18s ease;
    }

    .macro-row:hover{
      transform:translateY(-1px);
    }

    .macro-row .grow{
      flex:1;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:3px;
    }

    .macro-row .grow b{
      font-weight:700;
      font-size:15px;
      overflow-wrap:anywhere;
    }

    .macro-row .grow small{
      color:var(--muted);
      font-size:12px;
    }

    .macro-row .end{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      justify-content:center;
      gap:3px;
      text-align:right;
    }

    .macro-row .end b{
      font-size:15px;
      font-weight:800;
    }

    .macro-row .tag{
      margin-top:2px;
    }

    .macro-progress{
      height:8px;
      border-radius:999px;
      background:var(--surface-3);
      overflow:hidden;
      border:1px solid rgba(29,29,27,0.02);
      margin-top:8px;
    }

    .macro-progress > i{
      display:block;
      height:100%;
      width:0;
      background:linear-gradient(90deg, var(--accent), #7bd0b1);
      border-radius:999px;
    }

    .macro-row .status-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--accent);
      display:inline-block;
      margin-right:6px;
    }

    .macro-summary{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
      margin-top:10px;
    }

    .macro-card{
      background:var(--surface-2);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 12px 10px;
    }

    .macro-card .label{
      font-size:11px;
      letter-spacing:0.08em;
      color:var(--muted);
      text-transform:uppercase;
      font-weight:700;
    }

    .macro-card .value{
      display:block;
      margin-top:6px;
      font-size:22px;
      font-weight:800;
      letter-spacing:-0.04em;
    }

    [data-mode="dark"] .macro-summary .macro-card,
    [data-mode="dark"] .macro-mini .mini-card,
    [data-mode="dark"] .macro-row{
      background:var(--surface);
      border-color:var(--line);
    }

        return {title:p.name,body:'<div class=\"sum\"><div class=\"total\"><span style=\"font-weight:700\">'+esc(n>0?T('Owes you'):n<0?T('You owe'):T('All settled'))+'</span><b class=\"num'+(n<0?' out':'')+'\">'+fmt(Math.abs(n))+'</b></div></div><section class=\"card flush\">'+(ls.length?ls.map(function(l){var tg=loanTag(l);return '<button class=\"row\" data-a=\"loan\" data-id=\"'+l.id+'\"><span class=\"grow\"><b>'+esc(person(l.pid).name)+'</b><small>'+esc(l.note||fmtDate(l.ts))+'</small></span><span class=\"end\"><b class=\"num\">'+fmt(balOf(l))+'</b></small></span></button>';}).join(''):'')+'</section><div class=\"form\">'+btn('addLoanFor',T('Add loan'),'primary',{id:p.id})+btn('personEdit',T('Edit'),'',{id:p.id})+'</div>'};
      },
      personForm:function(s){var p=find(db.people,s.id);if(!p)return null;return {title:T('Edit person'),body:'<div class=\"form\">'+fInput('f_name',T('Name'),{})+fInput('f_phone',T('Phone'),{type:'tel'})+'</div>'+errBox()+btn('personSave',T('Save'),'primary')};},
      pin:function(){return {title:T('Set a PIN'),body:'<div class=\"form\">'+fInput('f_p1',T('New 4-digit PIN'),{im:'numeric',ml:4,type:'password'})+fInput('f_p2',T('Repeat the PIN'),{im:'numeric',ml:4,type:'password'})+'</div>'+errBox()+btn('pinSave',T('Save'),'primary')};}
    };
    function renderSheet(){
      var root=$('#sheetRoot'),s=state.sheet;if(!s){root.innerHTML='';return;}
      var r=SHEETS[s.t]?SHEETS[s.t](s):null;if(!r){state.sheet=null;root.innerHTML='';return;}
      var old=root.querySelector('.panel'),st=old&&s===renderSheet.last?old.scrollTop:0;
      root.innerHTML='<div class=\"scrim\" data-scrim=\"1\"><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\"'+esc(r.title)+'\" tabindex=\"-1\"><div class=\"head\"><h2>'+esc(r.title)+'</h2><button type=\"button\" class=\"iconbtn\" data-a=\"closeSheet\" aria-label=\"'+esc(T('Close'))+'\">'+ic(I.x,18,2)+'</button></div>'+(r.body||'')+'</div></div>';
      var p=root.querySelector('.panel');p.scrollTop=st;if(s!==renderSheet.last)p.focus();renderSheet.last=s;
    }
    function renderConf(){
      var root=$('#confRoot'),c=state.conf;if(!c){root.innerHTML='';return;}
      root.innerHTML='<div class=\"scrim center\" data-scrim=\"1\"><div class=\"panel\" role=\"alertdialog\" aria-modal=\"true\" tabindex=\"-1\"><h2>'+esc(c.title)+'</h2>'+(c.msg?'<p class=\"sub\">'+esc(c.msg)+'</p>':'')+'<div class=\"btns\">'+(c.danger?'<button type=\"button\" class=\"btn danger\" data-a=\"confYes\">'+esc(c.ok||T('Yes'))+'</button>':'<button type=\"button\" class=\"btn primary\" data-a=\"confYes\">'+esc(c.ok||T('Yes'))+'</button>')+'<button type=\"button\" class=\"btn\" data-a=\"confNo\">'+esc(c.cancel||T('Cancel'))+'</button></div></div></div>';
      if(c!==renderConf.last)root.querySelector('.panel').focus();renderConf.last=c;
    }
    var lastKey='';
    function navHtml(){
      var b=function(t,icon,label){return '<button type=\"button\" data-a=\"tab\" data-v=\"'+t+'\"'+(state.tab===t?' aria-current=\"page\"':'')+'>'+ic(icon,22)+esc(label)+'</button>';};
      return b('home',I.home,T('Home'))+b('people',I.users,T('People'))+'<button type=\"button\" class=\"mid\" data-a=\"quick\" aria-label=\"'+esc(T('Add a loan'))+'\"><span class=\"disc\">'+ic(I.plus,26,2.2)+'</span></button>';
    }
    function kbdHints(root){var els=[].slice.call(root.querySelectorAll('input:not([type=hidden]):not([type=file]):not([type=color]):not([type=date]),textarea'));els.forEach(function(e,i){if(e.tagName==='TEXTAREA'){e.setAttribute('enterkeyhint','enter');return;}e.setAttribute('enterkeyhint',i<els.length-1?'next':'done');});}
    function render(){
      var y=window.scrollY,key=state.tab+'|'+state.pages.length+'|'+state.locked,ae=document.activeElement,fid=ae&&ae.id?ae.id:'',a0=0,a1=0;
      try{if(fid&&ae.selectionStart!=null){a0=ae.selectionStart;a1=ae.selectionEnd;}}catch(e){}
      var top=state.pages[state.pages.length-1];
      var html=state.locked?viewLock():top==='alerts'?viewAlerts():(top&&top.indexOf('set:')===0)?viewSetPage(top.slice(4)):state.tab==='home'?viewHome():state.tab==='people'?viewPeople():state.tab==='activity'?viewActivityTab():viewHome();
      $('#app').innerHTML=html;
      $('#nav').hidden=state.locked||!!top;document.body.classList.toggle('nonav',state.locked||!!top);if(!state.locked&&!top)$('#navIn').innerHTML=navHtml();
      renderSheet();renderConf();
      if(fid){var n=document.getElementById(fid);if(n&&n!==document.activeElement){n.focus();try{n.setSelectionRange(a0,a1);}catch(e){}}}
      document.documentElement.style.overflow=(state.sheet||state.conf)?'hidden':'';
      window.scrollTo(0,key===lastKey?y:0);lastKey=key;syncHist();
    }
    function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},2600);}
    function showErr(m){var e=document.querySelector(state.sheet?'#sheetRoot #sheetErr':'#sheetErr');if(!e){toast(m);return false;}e.textContent=m;e.hidden=false;return false;}
    function ask(o){state.conf=o;render();}
    function upSheet(){var f=state.sheet&&state.sheet.from;return f?{t:f.t,id:f.id}:null;}
    function openSheet(s,f){state.sheet=s;state.f=f||{};render();}

    var histN=0,histIgnore=0;
    function depth(){return (state.conf?1:0)+(state.sheet?1:0)+(state.sheet&&state.sheet.from?1:0)+state.pages.length+(state.tab!=='home'?1:0);}
    function backOnce(){if(state.conf)state.conf=null;else if(state.sheet)state.sheet=upSheet();else if(state.pages.length)state.pages.pop();else if(state.tab!=='home')state.tab='home';}
    function syncHist(){if(histIgnore>0||state.locked)return;var d=depth();try{if(d>histN){while(histN<d){histN++;history.pushState({d:histN},'');}}else if(d<histN){var n=histN-d;histN=d;histIgnore++;history.go(-n);}}catch(e){}}
    window.addEventListener('popstate',function(e){if(histIgnore>0){histIgnore--;if(!histIgnore)syncHist();return;}histN=(e.state&&e.state.d)||0;var g=10;while(depth()>histN&&g-->0)backOnce();render();});
    
    function readPhoto(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));};im.src=r.result;};r.readAsDataURL(file);}
    function pickPhoto(cb){var i=$('#photoIn');i.value='';i.onchange=function(){if(i.files&&i.files[0])readPhoto(i.files[0],cb);};i.click();}

    function pinHash(p){var h=5381,s='amanah|'+p;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h);}
    function getPerson(name,phone){var n=name.trim(),p=null;db.people.forEach(function(x){if(x.name.toLowerCase()===n.toLowerCase())p=x;});if(!p){p={id:uid(),name:n,phone:phone||''};db.people.push(p);}else if(phone&&!p.phone)p.phone=phone;return p;}
    function loanSave(){
      var s=state.sheet,l=s.id?find(db.loans,s.id):null,f=state.f,name=(f.f_name||'').trim(),amt=num(f.f_amt),date=fromYmd(f.f_date)||startOfDay(Date.now()),due=fromYmd(f.f_due)||0;
      if(!name)return showErr(T('Enter the name.'));if(!amt)return showErr(T('Enter the amount.'));if(due&&due<startOfDay(date))return showErr(T('The repayment date is before the loan date.'));
      var ts=startOfDay(date)===startOfDay(Date.now())?Date.now():date+43200000,phone=(f.f_phone||'').trim();
      if(l){
        var p=getPerson(name,phone);if(phone)p.phone=phone;l.pid=p.id;l.amount=Math.max(amt,0);l.ts=(l.ts&&startOfDay(l.ts)===startOfDay(date))?l.ts:ts;l.due=due;l.note=(f.f_note||'').trim();save();toast(T('Saved'));openSheet({t:'loan',id:l.id});return false;
      }
      var pe=getPerson(name,phone),dir=f.f_dir||'lent';
      var nl={id:uid(),dir:dir,pid:pe.id,amount:amt,ts:ts,due:due,note:(f.f_note||'').trim(),photo:f.f_photo||'',status:'open',payments:[],methods:[]};
      db.loans.push(nl);save();state.side=dir;state.filter='all';state.q='';state.sheet=null;state.tab='home';state.pages=[];toast(T('Loan saved'));
    }
    function act(a,el){
      var id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),l=id?find(db.loans,id):null;
      switch(a){
        case 'tab':state.pq='';state.tab=v;state.pages=[];state.sheet=null;state.conf=null;state.f={};break;
        case 'quick':openSheet({t:'quick'});return false;
        case 'back':if(histN>0){history.back();return false;}backOnce();break;
        case 'closeSheet':state.sheet=upSheet();break;
        case 'confNo':state.conf=null;break;
        case 'confYes':var fn=state.conf&&state.conf.fn;state.conf=null;if(fn)fn();break;
        case 'side':state.side=v;break;
        case 'filter':state.filter=v;break;
        case 'loan':openSheet({t:'loan',id:id,from:(state.sheet&&state.sheet.t==='person')?{t:'person',id:state.sheet.id}:null});return false;
        case 'person':openSheet({t:'person',id:id});return false;
        case 'addLoan':openSheet({t:'loanForm'},{f_dir:v,f_date:ymd(Date.now())});return false;
        case 'addLoanFor':var pp=find(db.people,id);openSheet({t:'loanForm'},{f_dir:'lent',f_name:pp.name,f_phone:pp.phone,f_date:ymd(Date.now())});return false;
        case 'loanEdit':var pe=person(l.pid);openSheet({t:'loanForm',id:id},Object.assign({f_dir:l.dir,f_name:pe.name,f_phone:pe.phone,f_amt:String(l.amount),f_date:ymd(l.ts),f_due:l.due?ymd(l.due):''}));return false;
        case 'fDir':state.f.f_dir=v;break;
        case 'dueIn':var base=startOfDay(Date.now());state.f.f_due=Number(v)?ymd(addDays(base,Number(v))):'';break;
        case 'loanSave':return loanSave();
        case 'photoPick':pickPhoto(function(d){state.f.f_photo=d;render();});return false;
        case 'photoClear':state.f.f_photo='';break;
        case 'photoAdd':pickPhoto(function(d){l.photo=d;save();render();});return false;
        case 'photoRm':l.photo='';save();break;
        case 'payOpen':openSheet({t:'pay',id:id},{});return false;
        case 'paySave':
          var amt=num(state.f.f_pay);if(!amt)return showErr(T('Enter the amount.'));if(amt>balOf(l))return showErr(T('That is more than the balance ({n}).',{n:fmt(balOf(l))}));
          var pd=fromYmd(state.f.f_pdate)||startOfDay(Date.now());l.payments.push({id:uid(),ts:startOfDay(pd)===startOfDay(Date.now())?Date.now():pd+43200000,amount:amt,note:(state.f.f_pnote||'').trim()});save();toast(balOf(l)<=0?T('Fully paid. Mashallah!'):T('Payment saved'));openSheet({t:'loan',id:id});return false;
        case 'forgive':ask({title:T('Forgive this debt?'),msg:T('{n} will not owe you {a} Birr any more. The history stays.',{n:person(l.pid).name,a:fmt(balOf(l))}),ok:T('Forgive'),fn:function(){l.status='forgiven';save();}});return false;
        case 'gift':ask({title:T('Mark as a gift?'),msg:T('It will not count as debt.'),ok:T('Yes'),fn:function(){l.status='gift';save();}});return false;
        case 'reopen':l.status='open';save();break;
        case 'loanDel':ask({title:T('Delete this loan?'),msg:T('This removes the loan and its payments.'),ok:T('Delete'),danger:true,fn:function(){db.loans=db.loans.filter(function(x){return x.id!==id;});save();}});return false;
        case 'remind':openSheet({t:'remind',id:id},{f_rl:db.settings.remindLang,f_tone:'polite',f_msg:remindText(l,'polite',db.settings.remindLang)});return false;
        case 'rtone':state.f.f_tone=v;state.f.f_msg=remindText(find(db.loans,state.sheet.id),v,F('f_rl',db.settings.remindLang));break;
        case 'rlangSel':state.f.f_rl=v;state.f.f_msg=remindText(find(db.loans,state.sheet.id),F('f_tone','polite'),v);break;
        case 'send':
          var msg=encodeURIComponent(state.f.f_msg||''),ph=waNumber(person(l.pid).phone),url;
          if(v==='copy'){copyText(state.f.f_msg||'');return false;}
          url=v==='wa'?'https://wa.me/'+ph+'?text='+msg:v==='tg'?'https://t.me/share/url?url=%20&text='+msg:'sms:'+(person(l.pid).phone||'')+'?body='+msg;
          save();window.open(url,'_blank');return false;
        case 'personEdit':var ep=find(db.people,id);openSheet({t:'personForm',id:id},{f_name:ep.name,f_phone:ep.phone});return false;
        case 'personSave':var sp=find(db.people,id),nm=(state.f.f_name||'').trim();if(!nm)return showErr(T('Enter the name.'));sp.name=nm;sp.phone=(state.f.f_phone||'').trim();save();toast(T('Saved'));break;
        case 'alerts':state.pages.push('alerts');break;
        case 'setp':state.pages.push('set:'+v);break;
        case 'ptab':state.ptab=v;break;
        case 'actf':state.actFilter=v;if(v==='date'&&!state.actDate)state.actDate=ymd(Date.now());if(v==='range'){if(!state.actFrom)state.actFrom=ymd(Date.now());if(!state.actTo)state.actTo=ymd(Date.now());}break;
        case 'mode':db.settings.mode=v;save();applyTheme();break;
        case 'palette':db.settings.palette=v;save();applyTheme();break;
        case 'size':db.settings.textSize=v;save();applyTheme();break;
        case 'rlang':db.settings.remindLang=v;save();break;
        case 'pinSet':openSheet({t:'pin'},{});return false;
        case 'pinSave':var p1=state.f.f_p1||'',p2=state.f.f_p2||'';if(!/^\d{4}$/.test(p1))return showErr(T('Use exactly 4 digits.'));if(p1!==p2)return showErr(T('The two PINs are different.'));db.settings.pin=pinHash(p1);save();toast(T('PIN saved'));break;
        case 'pinOff':ask({title:T('Turn off the PIN?'),ok:T('Turn off'),danger:true,fn:function(){db.settings.pin='';save();}});return false;
        case 'pinKey':
          if(v==='del')state.pin=state.pin.slice(0,-1);else if(state.pin.length<4)state.pin+=v;
          if(state.pin.length===4){if(pinHash(state.pin)===db.settings.pin){state.locked=false;state.pin='';}else{state.pin='';render();var le=$('#lockErr');if(le)le.hidden=false;return false;}}
          break;
        case 'backup':if(download('amanah-backup-'+ymd(Date.now())+'.json',JSON.stringify(db),'application/json')){db.settings.backupAt=Date.now();save();toast(T('Backup file saved'));}return false;
        case 'copyBackup':copyText(JSON.stringify(db),T('Backup copied'));db.settings.backupAt=Date.now();save();return false;
        case 'restore':return restoreFrom(String(state.f.bk_in||'').trim());
        case 'pickBackup':$('#bk_file').click();return false;
        case 'clearDemo':ask({title:T('Remove the example data?'),msg:T('Your own entries stay.'),ok:T('Remove'),danger:true,fn:function(){var k=function(x){return !x.demo;};db.people=db.people.filter(k);db.loans=db.loans.filter(function(x){return !x.demo;});save();}});return false;
        case 'resetAll':ask({title:T('Erase everything?'),msg:T('All loans and people on this phone will be deleted. Make a backup first.'),ok:T('Erase'),danger:true,fn:function(){var s=db.settings;db.people=[];db.loans=[];db.activity=[];db.settings=Object.assign({},defaults());save();}});return false;
        default:return false;
      }
    }
    function copyText(t,m){var ok=function(){toast(m||T('Copied'));},fb=function(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.parentNode.removeChild(a);ok();};try{fb();}catch(e){toast(T('Something went wrong. Please try again.'));}}
    function download(name,text,mime){try{var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}catch(e){}}
    function restoreFrom(text){
      var o=null;try{o=JSON.parse(text);}catch(e){}
      if(!o||!Array.isArray(o.loans)||!Array.isArray(o.people))return showErr(T('That is not a valid backup.'));
      ask({title:T('Restore this backup?'),msg:T('This replaces everything on this phone: {n} loans.',{n:o.loans.length}),ok:T('Yes, restore'),danger:true,fn:function(){o.settings=Object.assign(defaults(),o.settings||{});db=o;save();}});
    }
    document.addEventListener('click',function(e){
      var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-scrim')){if(state.conf)state.conf=null;else state.sheet=upSheet();render();return;}
      var el=t.closest?t.closest('[data-a]'):null;if(!el||el.disabled)return;var r;
      try{r=act(el.getAttribute('data-a'),el);}catch(err){console.error(err);toast(T('Something went wrong. Please try again.'));return;}
      if(r!==false)render();
    });
    document.addEventListener('input',function(e){
      var el=e.target;if(el.hasAttribute('data-f'))state.f[el.id]=el.value;
      if(el.id&&(el.id.indexOf('f_ma_')===0||el.id==='f_amt')){var al=$('#mAlloc');if(al){var tmp=document.createElement('div');tmp.innerHTML=mAllocLine();if(tmp.firstChild){al.textContent=tmp.firstChild.textContent;}}}
      if(el.getAttribute('data-live')==='list'){state.q=el.value;$('#list').innerHTML=loanList();}
      if(el.getAttribute('data-live')==='plist'){state.pq=el.value;$('#plist').innerHTML=peopleList();}
    });
    document.addEventListener('change',function(e){
      var el=e.target;if(el.id==='bk_file'){var f=el.files&&el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restoreFrom(String(r.result||''));el.value='';};r.readAsText(f);}
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&e.target&&e.target.tagName==='INPUT'&&e.target.closest&&e.target.closest('#sheetRoot')){var all=[].slice.call(document.querySelectorAll('#sheetRoot input:not([type=hidden]):not([type=file]):not([type=color]):not([type=date]),#sheetRoot textarea')),i=all.indexOf(e.target);e.preventDefault();if(i>-1&&i<all.length-1)all[i+1].focus();else e.target.blur();return;}
      if(e.key==='Escape'){if(state.conf)state.conf=null;else if(state.sheet)state.sheet=upSheet();else return;render();}
    });
    var hiddenAt=0;
    document.addEventListener('visibilitychange',function(){if(document.hidden){hiddenAt=Date.now();return;}if(db.settings.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&!state.locked){state.locked=true;state.pin='';state.sheet=null;state.conf=null;render();}});
    db=load();if(!db){db=seed();save();}
    state.locked=!!db.settings.pin;
    applyTheme();
    try{history.replaceState({d:0},'');}catch(e){}
    try{var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',function(){if(db.settings.mode==='auto'){applyTheme();render();}});}catch(e){}
    render();
    addEventListener('input',function(e){var c=e.target&&e.target.getAttribute&&e.target.getAttribute('data-col');if(c){db.settings[c]=e.target.value;save();applyTheme();}});
    addEventListener('beforeinstallprompt',function(e){e.preventDefault();});
    if(window.__SW__){try{if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}catch(e){}}
    function actDateEv(e){var t=e.target,k=t&&t.getAttribute?t.getAttribute('data-act'):null;if(k!=='actDate'&&k!=='actFrom'&&k!=='actTo')return;state[k]=t.value;var b=$('#actBody');if(b)b.innerHTML=actBody();}
    document.addEventListener('input',actDateEv);
    document.addEventListener('change',actDateEv);
    })();
  </script>
